# Optional Qdrant instance for the `qdrant` store backend.
#
#   docker compose up -d qdrant
#   pip install "ragforge[qdrant]"
#   ragforge index --corpus examples/corpus --store qdrant
#
# The default `memory` store needs none of this — bring Qdrant in when the corpus
# outgrows a single process, or when you want persistence shared across services.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ragforge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + web dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
