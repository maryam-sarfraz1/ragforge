name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=ragforge --cov-report=term-missing

  # The core package must stay usable with numpy alone. This job installs no
  # extras and would fail if an optional backend leaked into an import path.
  minimal-install:
    name: core install (numpy only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Import and run without any optional dependency
        run: |
          python -c "import ragforge; print(ragforge.__version__)"
          ragforge index --corpus examples/corpus --out .ragforge
          ragforge query "how do I rotate an API key?" -k 3

  # The point of the package: retrieval quality is gated like any other test.
  retrieval-quality:
    name: retrieval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Evaluate against the demo corpus
        run: |
          ragforge eval \
            --corpus examples/corpus \
            --queries examples/evalset.jsonl \
            --config examples/config.json \
            --html retrieval-report.html \
            --json retrieval-results.json \
            --min-recall 0.90 --gate-k 5

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: |
            retrieval-report.html
            retrieval-results.json
